<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            margin-top: 50px; 
            background-color: #f4f4f9;
        }
        .form-container { 
            background-color: white;
            border: 1px solid #ddd; 
            padding: 30px; 
            border-radius: 8px; 
            width: 300px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h3 { text-align: center; color: #333; }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            box-sizing: border-box; 
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover { background-color: #0056b3; }
        #message { color: green; text-align: center; display: none; margin-top: 15px;}
    </style>
</head>
<body>

<div class="form-container">
    <h3>আপনার তথ্য দিন</h3>
    
    <form id="sheetdb-form">
        <!-- 'name' এবং 'phone' হলো গুগল শিটের কলামের নাম -->
        <input type="text" name="data[name]" placeholder="আপনার নাম লিখুন" required>
        <input type="tel" name="data[phone]" placeholder="ফোন নম্বর লিখুন" required>
        <button type="submit">জমা দিন</button>
    </form>
    
    <p id="message">তথ্য সফলভাবে জমা হয়েছে!</p>
</div>

<script>
    var form = document.getElementById('sheetdb-form');
    
    form.addEventListener("submit", e => {
      e.preventDefault();
      
      // নিচের লিংকের জায়গায় আপনার SheetDB-এর API URL টি বসিয়ে দিন
      fetch('https://sheetdb.io/api/v1/3ib1zuejbrvbd', {
        method: 'POST',
        body: new FormData(form)
      }).then(
        response => response.json()
      ).then((html) => {
        // ডেটা সফলভাবে গেলে মেসেজ দেখাবে এবং ফর্মটি খালি হয়ে যাবে
        document.getElementById('message').style.display = 'block';
        form.reset();
        
        // ৩ সেকেন্ড পর মেসেজটি আবার লুকিয়ে যাবে
        setTimeout(() => {
            document.getElementById('message').style.display = 'none';
        }, 3000);
      });
    });
</script>

</body>
</html>
